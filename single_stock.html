<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Monitor - Single Stock Analytics</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #e6edf3; line-height: 1.6; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #30363d; }
        h1 { font-size: 1.8rem; font-weight: 600; }
        .ticker-select { padding: 8px 12px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-size: 1rem; min-width: 200px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; }
        .card h3 { font-size: 1rem; font-weight: 600; margin-bottom: 16px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
        .metric-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #21262d; }
        .metric-row:last-child { border-bottom: none; }
        .metric-label { color: #8b949e; font-size: 0.9rem; }
        .metric-value { font-weight: 600; font-size: 1.1rem; }
        .metric-value.positive { color: #3fb950; }
        .metric-value.negative { color: #f85149; }
        .metric-value.warning { color: #d29922; }
        .signal-badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .signal-recovering { background: #1f6feb; color: white; }
        .signal-deteriorating { background: #f85149; color: white; }
        .signal-strong-trend { background: #3fb950; color: white; }
        .signal-neutral { background: #30363d; color: #8b949e; }
        .signal-peer-leader { background: #3fb950; color: white; }
        .signal-peer-laggard { background: #f85149; color: white; }
        .signal-peer-average { background: #30363d; color: #8b949e; }
        .signal-high-beta { background: #f85149; color: white; }
        .signal-low-beta { background: #3fb950; color: white; }
        .signal-neutral-beta { background: #30363d; color: #8b949e; }
        .trend-indicator { display: inline-flex; align-items: center; gap: 4px; font-size: 0.85rem; }
        .trend-up { color: #3fb950; }
        .trend-down { color: #f85149; }
        .trend-flat { color: #8b949e; }
        .peer-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .peer-table th, .peer-table td { padding: 8px; text-align: left; border-bottom: 1px solid #21262d; }
        .peer-table th { color: #8b949e; font-weight: 500; }
        .peer-table tr:hover { background: #21262d; }
        .chart-placeholder { height: 200px; background: #0d1117; border: 1px dashed #30363d; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #484f58; margin-bottom: 16px; }
        .section { margin-bottom: 30px; }
        .section h2 { font-size: 1.3rem; font-weight: 600; margin-bottom: 16px; }
        .loading { text-align: center; color: #8b949e; padding: 40px; }
        .error { color: #f85149; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Stock Analytics</h1>
            <select class="ticker-select" id="tickerSelect" onchange="loadStockData()">
                <option value="">Select a ticker...</option>
            </select>
        </header>

        <div id="loading" class="loading" style="display: none;">Loading data...</div>
        <div id="error" class="error" style="display: none;"></div>

        <div id="content" style="display: none;">
            <!-- Signals Row -->
            <div class="grid" id="signalsRow">
                <div class="card">
                    <h3>Fundamental Signal</h3>
                    <div id="fundamentalSignal" class="signal-badge">-</div>
                    <p id="fundamentalDetail" style="margin-top: 8px; color: #8b949e; font-size: 0.9rem;"></p>
                </div>
                <div class="card">
                    <h3>Peer Signal</h3>
                    <div id="peerSignal" class="signal-badge">-</div>
                    <p id="peerDetail" style="margin-top: 8px; color: #8b949e; font-size: 0.9rem;"></p>
                </div>
                <div class="card">
                    <h3>Beta Signal</h3>
                    <div id="betaSignal" class="signal-badge">-</div>
                    <p id="betaDetail" style="margin-top: 8px; color: #8b949e; font-size: 0.9rem;"></p>
                </div>
                <div class="card">
                    <h3>Current Regime</h3>
                    <div id="regimeSignal" class="signal-badge" style="background: #1f6feb;">-</div>
                    <p id="regimeDetail" style="margin-top: 8px; color: #8b949e; font-size: 0.9rem;"></p>
                </div>
            </div>

            <!-- Key Metrics -->
            <div class="section">
                <h2>Key Metrics</h2>
                <div class="grid" id="keyMetrics"></div>
            </div>

            <!-- Fundamental Trends -->
            <div class="section">
                <h2>Fundamental Trends</h2>
                <div class="grid" id="trendsGrid"></div>
            </div>

            <!-- Peer Comparison -->
            <div class="section">
                <h2>Peer Group Comparison</h2>
                <div class="card" style="overflow-x: auto;">
                    <h3 id="peerGroupTitle">Best Peer Group</h3>
                    <table class="peer-table" id="peerTable">
                        <thead>
                            <tr>
                                <th>Metric</th>
                                <th>Value</th>
                                <th>Peer Rank</th>
                                <th>Best Peer</th>
                            </tr>
                        </thead>
                        <tbody id="peerTableBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- Recovery / Deterioration Signals -->
            <div class="section">
                <h2>Trend Signals</h2>
                <div class="grid" id="recoveryGrid"></div>
            </div>
        </div>
    </div>

    <script>
        let allTickers = [];
        let allData = {};

        async function loadTickers() {
            try {
                const response = await fetch('dashboard_data/data.json');
                const data = await response.json();
                allData = data.tables;
                
                // Extract tickers from preferred_metrics
                if (allData.preferred_metrics) {
                    allTickers = allData.preferred_metrics.map(r => r.ticker).filter(t => t);
                    allTickers.sort();
                    const select = document.getElementById('tickerSelect');
                    allTickers.forEach(t => {
                        const opt = document.createElement('option');
                        opt.value = t;
                        opt.textContent = t;
                        select.appendChild(opt);
                    });
                }
            } catch (e) {
                console.error('Failed to load tickers:', e);
            }
        }

        async function loadStockData() {
            const ticker = document.getElementById('tickerSelect').value;
            if (!ticker) {
                document.getElementById('content').style.display = 'none';
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('content').style.display = 'none';
            document.getElementById('error').style.display = 'none';

            try {
                // Get peer analytics signals for this ticker
                const signals = allData.peer_analytics_signals?.find(r => r.ticker === ticker);
                const trends = allData.peer_fundamental_trends?.filter(r => r.ticker === ticker);
                const recovery = allData.peer_recovery_signals?.filter(r => r.ticker === ticker);
                const peerSignals = allData.peer_signals?.filter(r => r.ticker === ticker);
                
                if (!signals) {
                    throw new Error('No data found for ' + ticker);
                }

                renderAll(ticker, signals, trends, recovery, peerSignals);
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch (e) {
                console.error(e);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = e.message;
            }
        }

        function renderAll(ticker, signals, trends, recovery, peerSignals) {
            // Signals row
            renderSignal('fundamentalSignal', 'fundamentalDetail', signals.fundamental_signal, 
                getFundamentalDetail(signals));
            renderSignal('peerSignal', 'peerDetail', signals.peer_signal,
                `Best peer group: ${signals.best_peer_group || 'N/A'} | Sharpe rank: ${formatPct(signals.best_sharpe_rank)}`);
            renderSignal('betaSignal', 'betaDetail', signals.beta_signal,
                `Avg beta to peers: ${formatNum(signals.avg_beta_to_peers, 2)} | ${signals.high_beta_any_group ? 'High beta in some group' : signals.low_beta_any_group ? 'Low beta in some group' : 'Neutral beta'}`);
            renderSignal('regimeSignal', 'regimeDetail', 'REGIME',
                `${getCurrentRegime()}`);

            // Key metrics
            renderKeyMetrics(signals);

            // Trends
            renderTrends(trends);

            // Peer comparison
            renderPeerComparison(signals, peerSignals);

            // Recovery signals
            renderRecovery(recovery);
        }

        function renderSignal(signalId, detailId, signal, detail) {
            const signalEl = document.getElementById(signalId);
            const detailEl = document.getElementById(detailId);
            
            const classMap = {
                'RECOVERING': 'signal-recovering',
                'DETERIORATING': 'signal-deteriorating',
                'STRONG_TREND': 'signal-strong-trend',
                'NEUTRAL': 'signal-neutral',
                'PEER_LEADER': 'signal-peer-leader',
                'PEER_LAGGARD': 'signal-peer-laggard',
                'PEER_AVERAGE': 'signal-peer-average',
                'HIGH_BETA': 'signal-high-beta',
                'LOW_BETA': 'signal-low-beta',
                'NEUTRAL_BETA': 'signal-neutral-beta'
            };
            
            signalEl.textContent = signal.replace(/_/g, ' ');
            signalEl.className = 'signal-badge ' + (classMap[signal] || '');
            detailEl.textContent = detail || '';
        }

        function getFundamentalDetail(s) {
            const parts = [];
            if (s.recovery_count > 0) parts.push(`${s.recovery_count} recovering`);
            if (s.deterioration_count > 0) parts.push(`${s.deterioration_count} deteriorating`);
            if (s.strong_trend_count > 0) parts.push(`${s.strong_trend_count} strong trends`);
            return parts.length ? parts.join(' • ') : 'No strong signals';
        }

        function getCurrentRegime() {
            // Could read from hmm_regime_states
            return 'HMM regime: high_vol_stress (latest)';
        }

        function renderKeyMetrics(signals) {
            const container = document.getElementById('keyMetrics');
            const metrics = [
                { label: 'Decision', value: signals.decision || 'N/A', class: '' },
                { label: 'Composite Score', value: formatNum(signals.composite_score, 3), class: '' },
                { label: 'ROE', value: formatPct(signals.roe), class: '' },
                { label: 'ROIC', value: formatPct(signals.roic), class: '' },
                { label: 'D/E', value: formatNum(signals.debt_to_equity, 2), class: '' },
                { label: 'EV/EBITDA', value: formatNum(signals.ev_ebitda, 1), class: '' },
                { label: 'P/B', value: formatNum(signals.pb_ratio, 2), class: '' },
                { label: 'Earnings Stability', value: formatNum(signals.earnings_stability, 2), class: '' },
                { label: 'Interest Coverage', value: formatNum(signals.interest_coverage, 1), class: '' },
                { label: 'MktCap/Assets', value: formatPct(signals.mktcap_to_assets), class: '' },
                { label: 'Buffett Pass', value: signals.buffett_pass ? 'Yes' : 'No', class: signals.buffett_pass ? 'positive' : 'negative' },
                { label: 'Trifecta Pass', value: signals.trifecta_pass ? 'Yes' : 'No', class: signals.trifecta_pass ? 'positive' : 'negative' },
                { label: 'Suggested Max Wt', value: formatPct(signals.suggested_w_max), class: '' },
                { label: 'Sizing Action', value: signals.sizing_action || 'N/A', class: '' },
                { label: 'Best Sharpe Rank', value: formatPct(signals.best_sharpe_rank), class: '' },
                { label: 'Avg Beta to Peers', value: formatNum(signals.avg_beta_to_peers, 2), class: '' },
            ];
            
            container.innerHTML = metrics.map(m => `
                <div class="card">
                    <div class="metric-row">
                        <span class="metric-label">${m.label}</span>
                        <span class="metric-value ${m.class || ''}">${m.value}</span>
                    </div>
                </div>
            `).join('');
        }

        function renderTrends(trends) {
            const container = document.getElementById('trendsGrid');
            if (!trends || trends.length === 0) {
                container.innerHTML = '<div class="card"><p style="color: #8b949e;">No trend data available</p></div>';
                return;
            }
            
            const metricNames = ['roe', 'roic', 'debt_to_equity', 'ev_ebitda', 'pb_ratio', 'earnings_stability', 'interest_coverage', 'mktcap_to_assets'];
            container.innerHTML = metricNames.map(metric => {
                const t = trends.find(r => r.metric === metric);
                if (!t) return '';
                
                const trendDir = t.trend_direction || (t.overall_slope > 0 ? 'improving' : t.overall_slope < 0 ? 'declining' : 'flat');
                const trendClass = trendDir === 'improving' ? 'trend-up' : trendDir === 'declining' ? 'trend-down' : 'trend-flat';
                const trendIcon = trendDir === 'improving' ? '▲' : trendDir === 'declining' ? '▼' : '■';
                
                return `
                    <div class="card">
                        <h3>${metric.toUpperCase()}</h3>
                        <div class="metric-row">
                            <span class="metric-label">Latest</span>
                            <span class="metric-value">${formatNum(t.latest_value, 4)}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">Slope/Period</span>
                            <span class="metric-value">${formatNum(t.slope_per_period, 6)}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">Total Change</span>
                            <span class="metric-value">${formatPct(t.pct_change)}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">Recent vs Early</span>
                            <span class="metric-value">${formatPct(t.recent_vs_early_pct)}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">Trend</span>
                            <span class="trend-indicator ${trendClass}">${trendIcon} ${trendDir}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">Recovery</span>
                            <span class="signal-badge ${t.is_recovery ? 'signal-recovering' : 'signal-neutral'}">${t.is_recovery ? 'Yes' : 'No'}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">Deteriorating</span>
                            <span class="signal-badge ${t.is_deteriorating ? 'signal-deteriorating' : 'signal-neutral'}">${t.is_deteriorating ? 'Yes' : 'No'}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">Strong Trend</span>
                            <span class="signal-badge ${t.strong_trend ? 'signal-strong-trend' : 'signal-neutral'}">${t.strong_trend ? 'Yes' : 'No'}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderPeerComparison(signals, peerSignals) {
            const titleEl = document.getElementById('peerGroupTitle');
            const bodyEl = document.getElementById('peerTableBody');
            
            titleEl.textContent = `Best Peer Group: ${signals.best_peer_group || 'N/A'} (${signals.best_n_peers || 0} peers)`;
            
            const rows = [
                { metric: 'Return Rank', value: formatPct(signals.best_ret_rank), detail: 'Percentile vs peers' },
                { metric: 'Vol Rank', value: formatPct(signals.best_vol_rank), detail: 'Lower is better' },
                { metric: 'Sharpe Rank', value: formatPct(signals.best_sharpe_rank), detail: 'Percentile vs peers' },
                { metric: 'Avg Beta', value: formatNum(signals.avg_beta_to_peers, 2), detail: 'vs peer groups' },
                { metric: 'Beta vs Median', value: formatNum(signals.avg_beta_vs_median, 2), detail: 'vs group median' },
            ];
            
            bodyEl.innerHTML = rows.map(r => `
                <tr>
                    <td>${r.metric}</td>
                    <td><strong>${r.value}</strong></td>
                    <td>${r.detail}</td>
                    <td>${getBestPeerForMetric(r.metric, peerSignals) || 'N/A'}</td>
                </tr>
            `).join('');
        }

        function getBestPeerForMetric(metric, peerSignals) {
            if (!peerSignals || !peerSignals.length) return null;
            // Could find the best peer for this metric
            return 'See full peer table';
        }

        function renderRecovery(recovery) {
            const container = document.getElementById('recoveryGrid');
            if (!recovery || recovery.length === 0) {
                container.innerHTML = '<div class="card"><p style="color: #8b949e;">No recovery/deterioration signals</p></div>';
                return;
            }
            
            const recovering = recovery.filter(r => r.is_recovery);
            const deteriorating = recovery.filter(r => r.is_deteriorating);
            
            container.innerHTML = `
                <div class="card">
                    <h3>Recovering Metrics (${recovering.length})</h3>
                    ${recovering.length ? recovering.map(r => `
                        <div class="metric-row">
                            <span class="metric-label">${r.metric.toUpperCase()}</span>
                            <span class="signal-badge signal-recovering">RECOVERING</span>
                        </div>
                    `).join('') : '<p style="color: #8b949e;">None</p>'}
                </div>
                <div class="card">
                    <h3>Deteriorating Metrics (${deteriorating.length})</h3>
                    ${deteriorating.length ? deteriorating.map(r => `
                        <div class="metric-row">
                            <span class="metric-label">${r.metric.toUpperCase()}</span>
                            <span class="signal-badge signal-deteriorating">DETERIORATING</span>
                        </div>
                    `).join('') : '<p style="color: #8b949e;">None</p>'}
                </div>
            `;
        }

        function formatNum(val, decimals = 2) {
            if (val === null || val === undefined || isNaN(val)) return 'N/A';
            return val.toFixed(decimals);
        }

        function formatPct(val) {
            if (val === null || val === undefined || isNaN(val)) return 'N/A';
            return (val * 100).toFixed(1) + '%';
        }

        // Initialize
        loadTickers();
    </script>
</body>
</html>
