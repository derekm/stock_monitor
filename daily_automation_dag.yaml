# daily_automation_dag.yaml
# DAG configuration for run_daily_automation.py
# Each job: command (list), optional python interpreter override, description.
# Jobs intentionally have NO timeouts — let long pipelines finish.

jobs:
  hmm:
    cmd: ["hmm_regime_detection.py", "--n-states", "3", "--save"]
    desc: "HMM regime detection (3 states)"

  market_cap:
    cmd: ["add_daily_marketcap.py", "--years", "10", "--save"]
    desc: "PIT daily_mcap.parquet (shares × adj_close); does not write daily_prices"

  portfolio_report:
    cmd: ["portfolio_report.py", "--refresh"]
    desc: "Mark personal holdings from trades + last adj_close"

  rebalance:
    cmd: ["rebalance_calendar.py", "--months", "18", "--save"]
    desc: "Rebalance calendar"

  preferred:
    cmd: ["preferred_metrics.py", "--save"]
    desc: "Preferred metrics (Buffett + Damodaran)"

  implied_r:
    cmd: ["implied_r_screen.py", "--save"]
    desc: "Implied cost of capital screen"

  momentum:
    cmd: ["momentum_analytics.py", "--save"]
    desc: "Momentum analytics"

  inclusion:
    cmd: ["inclusion_criteria.py", "--explore-defensive", "--save"]
    desc: "Inclusion criteria"

  stress:
    cmd: ["stress_dual_pass.py", "--save"]
    desc: "Stress dual pass"

  crisis:
    cmd: ["crisis_correlation.py", "--save"]
    desc: "Crisis correlation"

  factor_rot:
    cmd: ["factor_rotation_defense.py", "run", "--save"]
    desc: "Factor rotation defense"

  risk_enrich:
    cmd: ["risk_enrich.py"]
    desc: "Risk enrichment"

  rolling:
    cmd: ["rolling_window_analysis.py", "--universe", "all", "--save"]
    desc: "Rolling window analysis"

  rolling_corr:
    cmd: ["rolling_correlation_windows.py", "--save"]
    desc: "Rolling correlation windows"

  tail_hedge:
    cmd: ["tail_risk_hedging.py", "--save"]
    desc: "Tail risk hedging"

  allpairs:
    cmd: ["allpairs_correlations.py", "--window", "63", "--step", "21", "--max-assets", "80"]
    desc: "All-pairs correlations"

  fund_snap:
    cmd: ["fundamentals_history.py", "snapshot"]
    desc: "Fundamentals snapshot"

  screen_bt:
    cmd: ["fundamentals_history.py", "backtest-screens"]
    desc: "Backtest screens"

  backfill_new_tickers:
    cmd: ["acquisition_backfill.py"]
    desc: "Backfill new tickers (no timeout — pipelines run to completion)"

  dupont:
    cmd: ["dupont_analysis.py", "--save"]
    desc: "DuPont analysis"

  growth:
    cmd: ["growth_tech_analytics.py"]
    desc: "Growth tech analytics"

  peer:
    cmd: ["peer_analytics.py", "--save"]
    desc: "Peer analytics"

  earnings:
    cmd: ["earnings_catalyst.py", "--save"]
    desc: "Earnings catalyst"

  pairs:
    cmd: ["pair_engine.py", "--save", "--max-per-group", "0", "--n-folds", "3"]
    desc: "Pair engine"

  cross:
    cmd: ["cross_section.py", "--save"]
    desc: "Cross-section"

  aggregate:
    cmd: ["signal_aggregator.py", "--save"]
    desc: "Signal aggregator"

  technical:
    cmd: ["technical_signals.py", "--save"]
    desc: "Technical signals"

  econ_cal:
    cmd: ["economic_calendar.py", "--save"]
    desc: "Economic calendar"

  est_rev:
    cmd: ["estimate_revisions.py", "--save"]
    desc: "Estimate revisions"

  shadow:
    cmd: ["shadow_book.py", "--save"]
    desc: "Shadow book"

  damodaran:
    cmd: ["damodaran_quality.py", "--all"]
    desc: "Damodaran quality"

  lookthrough:
    cmd: ["lookthrough_engine.py"]
    desc: "Lookthrough engine"

  acq_backfill:
    cmd: ["acquisition_backfill.py"]
    desc: "Acquisition backfill"

  taleb_tail:
    cmd: ["tail_index.py"]
    desc: "Taleb tail index"

  taleb_gap:
    cmd: ["gap_risk.py"]
    desc: "Taleb gap risk"

  taleb_iv_skew:
    cmd: ["iv_skew.py", "--skip-existing"]
    desc: "Taleb IV skew"

  taleb_ergodic:
    cmd: ["ergodicity_ruin.py"]
    desc: "Taleb ergodicity/ruin"

  taleb_fragility:
    cmd: ["fragility_screen.py"]
    desc: "Taleb fragility screen"

  options_skew:
    cmd: ["options_skew.py", "--save"]
    desc: "Options skew snapshot + PIT history (NOT back-fillable: yfinance serves only the live chain, so a missed day is lost forever)"

  taleb_minsky:
    cmd: ["macro_fragility.py", "--save"]
    desc: "Taleb Minsky"

  taleb_shock:
    cmd: ["macro_shock.py", "--save"]
    desc: "Taleb shock"

  taleb_sector_shock:
    cmd: ["macro_sector_shock.py", "--save"]
    desc: "Taleb sector shock"

  taleb_shock_ride:
    cmd: ["shock_ride.py", "--save"]
    desc: "Taleb shock ride"

  taleb_arista:
    cmd: ["arista.py", "--save"]
    desc: "Taleb ARISTA"

  taleb_ride_now:
    cmd: ["ride_now.py", "--save"]
    desc: "Taleb ride now"

  taleb_subindustry_regime:
    cmd: ["subindustry_regime.py", "--save"]
    desc: "Taleb subindustry regime"

  taleb_barbell:
    cmd: ["barbell_check.py"]
    desc: "Taleb barbell"

  taleb_optionality:
    cmd: ["hidden_optionality_audit.py"]
    desc: "Taleb optionality"


  update_prices:
    cmd: ["update_prices.py", "fetch", "--days", "5", "--save"]
    desc: "Daily prices (Polygon primary, yfinance fallback); root gate — all price readers depend on it"

  bogle_tmi:
    cmd: ["build_bogle_funds.py", "--fund", "tmi", "--save", "--years", "10"]
    desc: "Bogle Total Market Index (cap-weighted + Fisher chained)"
  bogle_qmi:
    cmd: ["build_bogle_funds.py", "--fund", "qmi", "--save", "--years", "10"]
    desc: "Bogle QMI — NM quality top quintile + Fisher"
  bogle_qmi_strict:
    cmd: ["build_bogle_funds.py", "--fund", "qmi_strict", "--save", "--years", "10"]
    desc: "Bogle QMI strict — Buffett 15/15/1.0 + Fisher"

  bogle_bpi:
    cmd: ["build_bogle_funds.py", "--fund", "bpi", "--save", "--years", "10"]
    desc: "Bogle Bond Proxy Index (defensive sectors, equal-weight)"

  universal_book:
    cmd: ["universal_portfolio.py", "book", "--save"]
    desc: "Cover universal portfolio — personal book daily weights (regret-optimal, no lookahead)"

  bogle_pmi:
    cmd: ["build_bogle_funds.py", "--fund", "pmi", "--save", "--years", "10"]
    desc: "Bogle Pink Market Index (TMI's OTC/gray complement, EW + 5% cap)"

  regime_clusters:
    cmd: ["regime_clustering.py", "--metric", "corr", "--linkage", "ward", "--years", "5", "--save"]
    desc: "HRP/codependence asset clusters vs GICS dispersion (Phase 1.5)"

  expected_returns:
    cmd: ["expected_returns.py", "--save"]
    desc: "Ilmanen 4-pillar ER panel → expected_returns_decomp.parquet (forecast input)"

  ticker_news:
    cmd: ["ticker_news.py", "--save", "--days", "2"]
    desc: "Polygon news firehose + article fetch (Docling) → news_articles bucket; CPU wheel, no LLM"

  news_mentions:
    python: "C:/Users/derek/src/stockmagic/.venv-xpu/Scripts/python.exe"
    cmd: ["ticker_news.py", "--mentions", "--save"]
    desc: "3B mention JSON per article on Intel Iris Xe Vulkan (.venv-xpu); after Docling"

  news_press:
    python: "C:/Users/derek/src/stockmagic/.venv-xpu/Scripts/python.exe"
    cmd: ["ticker_news.py", "--press", "--save"]
    desc: "3B per-ticker press lines from mentions on Intel Iris Xe Vulkan (.venv-xpu)"

  llm_forecast:
    python: "C:/Users/derek/src/stockmagic/.venv-xpu/Scripts/python.exe"
    cmd: ["forecast_llm.py"]
    desc: "3B desk forecast (coverage-gated, 3 profiles) on Intel Iris Xe Vulkan (.venv-xpu); reads press lines"

# dependencies: job -> list of jobs that must finish first
dependencies:
  rebalance: [hmm]
  market_cap: [update_prices, fund_snap]
  portfolio_report: [update_prices]
  inclusion: [preferred]
  implied_r: [preferred]
  momentum: [preferred]
  stress: [preferred, inclusion]
  risk_enrich: [preferred]
  rolling: [risk_enrich]
  rolling_corr: [preferred, risk_enrich]
  tail_hedge: [rolling, hmm]
  allpairs: [preferred]
  screen_bt: [preferred, inclusion]
  backfill_new_tickers: [acq_backfill]
  fund_snap: [backfill_new_tickers]
  dupont: [preferred]
  growth: [preferred, dupont]
  peer: [preferred]
  earnings: [growth, peer]
  pairs: [peer, earnings]
  cross: [peer, earnings, pairs]
  aggregate: [cross, earnings, pairs, peer, preferred]
  technical: [aggregate]
  econ_cal: [update_prices]
  est_rev: []
  shadow: [preferred, aggregate]
  damodaran: [preferred]
  lookthrough: [backfill_new_tickers]
  taleb_tail: [preferred]
  taleb_gap: [preferred]
  taleb_iv_skew: [preferred]
  taleb_ergodic: [taleb_tail]
  taleb_fragility: [taleb_tail, taleb_gap, taleb_iv_skew]
  taleb_minsky: [hmm, taleb_fragility]
  taleb_shock: [hmm]
  taleb_sector_shock: [hmm]
  taleb_shock_ride: [taleb_sector_shock]
  taleb_arista: [update_prices]
  taleb_subindustry_regime: [taleb_sector_shock]
  taleb_barbell: [taleb_fragility, taleb_ergodic]
  taleb_optionality: [aggregate, preferred]
  hmm: [update_prices]
  preferred: [update_prices]
  crisis: [update_prices]
  factor_rot: [update_prices]
  taleb_ride_now: [taleb_sector_shock, taleb_subindustry_regime, update_prices]
  update_prices: []
  acq_backfill: [update_prices]
  bogle_tmi: [update_prices, market_cap]
  bogle_qmi: [update_prices, market_cap]
  bogle_qmi_strict: [update_prices, market_cap]
  bogle_bpi: [update_prices, market_cap]
  universal_book: [update_prices]
  bogle_pmi: [update_prices, market_cap]
  regime_clusters: [market_cap]
  ticker_news: []
  # Serial news chain: firehose+Docling -> mentions -> press -> notes -> LLM
  # forecast. Forecast consumes the freshest press lines, so it must never
  # overlap the news stages; all 3B stages run on Vulkan .venv-xpu.
  news_mentions: [ticker_news]
  news_press: [news_mentions]
  expected_returns: [preferred, market_cap]
  llm_forecast: [news_press, hmm, preferred, implied_r, damodaran, taleb_fragility, market_cap, momentum, expected_returns]
  export: [aggregate, technical, econ_cal, est_rev, shadow,
            taleb_tail, taleb_gap, taleb_iv_skew, taleb_ergodic, taleb_fragility,
            taleb_minsky, taleb_shock, taleb_sector_shock, taleb_shock_ride,
            taleb_arista, taleb_subindustry_regime, taleb_barbell,
            taleb_optionality, lookthrough, damodaran, update_prices,
            bogle_tmi, bogle_qmi, bogle_qmi_strict, bogle_bpi, bogle_pmi, regime_clusters, portfolio_report]
